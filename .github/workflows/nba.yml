name: nba-paper

# NBA paper tracking ("NBA Test" tab; never sent to Discord).
# GitHub's cron runs hours late, so each run chains itself: it sleeps (free in a public repo) until ~75 min before the
# next tip, runs the game-night loop (lines + points/rebounds/assists props 30-60 min before each tip, closing prices),
# then starts a fresh run if games are still to come. The crons below only (re)start the chain each morning.
# Paper bets (data/nba/paper.csv) are committed every 10 minutes, so each is timestamped before tip-off, and the site
# is rebuilt after each commit. Results are graded from ESPN box scores on the next night.
# Raw odds stay in a GitHub Actions cache (never committed). Needs the ODDS_API_KEY secret.
on:
  schedule:
    - cron: "0 13 * * *"    # ~6 AM PT
    - cron: "0 17 * * *"    # ~10 AM PT
    - cron: "30 21 * * *"   # ~2:30 PM PT
  workflow_dispatch:
    inputs:
      minutes:
        description: "Max minutes for the game-night loop"
        default: "330"

concurrency:
  group: nba
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  night:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_SPORT: basketball_nba
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: grahambirch99/nfl-odds-logger
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: p
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore NBA odds cache
        uses: actions/cache/restore@v4
        with:
          path: nba-cache
          key: nba-db-${{ github.run_id }}
          restore-keys: nba-db-
      - name: Grade earlier bets (closing prices, ESPN results)
        env:
          ODDS_DB: nba-cache/nba.db
          NBA_OUT: data/nba
        run: |
          mkdir -p nba-cache
          timeout 1500 python p/nba_h2h.py update-logs || true       # ESPN box-score history for the matchup test
          [ -f nba-cache/nba.db ] || { echo "no NBA data yet"; exit 0; }
          python p/nba_paper.py > /dev/null || true
          python p/nba_h2h.py flag || true
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          git add data/nba
          if ! git diff --cached --quiet; then
            git commit -qm "nba paper graded $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main || true
          fi
      - name: Wait for the tip-off window
        id: wait
        run: python p/nba_wait.py wait --budget 290 --grade-csv data/nba/paper.csv >> "$GITHUB_OUTPUT"
      - name: Game night
        if: steps.wait.outputs.go == '1'
        env:
          ODDS_DB: nba-cache/nba.db
          OPS_STATE: nba-cache/state.json
          ODDS_DAYS_AHEAD: "0.7"
          ODDS_PROP_MARKETS: player_points,player_rebounds,player_assists
          POST_LO: "30"
          POST_HI: "60"
          OPS_INJURY: "0"
          OPS_ANGLES: "0"
          ALERTS_NO_LEDGER: "1"
          ALERTS_DIR: nba-cache/alerts
          MIN_CREDITS_RESERVE: "2000"
          NBA_OUT: data/nba
          SLEPT: ${{ steps.wait.outputs.slept }}
        run: |
          mkdir -p nba-cache data/nba
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          M=$(( 335 - ${SLEPT:-0} )); [ "$M" -gt "${{ inputs.minutes || '330' }}" ] && M=${{ inputs.minutes || '330' }}
          # Commit paper bets every 10 minutes, so each one is timestamped before tip-off; then rebuild the site.
          ( while sleep 600; do
              [ -f nba-cache/nba.db ] && python p/nba_h2h.py flag > /dev/null 2>&1 || true   # first, so v3 picks see the matchup side
              [ -f nba-cache/nba.db ] && python p/nba_paper.py > /dev/null 2>&1 || true
              git add data/nba 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -qm "nba paper bets $(date -u +%Y-%m-%dT%H:%MZ)"
                for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
                gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main > /dev/null 2>&1 || true
              fi
            done ) &
          python p/sunday_ops.py --max-minutes "$M" --tick 300
      - name: Grade edges (CLV now, results from ESPN)
        if: always() && steps.wait.outputs.go == '1'
        env:
          ODDS_DB: nba-cache/nba.db
          NBA_OUT: data/nba
        run: |
          [ -f nba-cache/nba.db ] && python p/nba_h2h.py flag || true
          [ -f nba-cache/nba.db ] && python p/nba_paper.py || echo "no NBA data tonight"
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          git add data/nba 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "nba paper $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main || true
          fi
      - name: Save NBA odds cache
        if: always() && steps.wait.outputs.go == '1'
        uses: actions/cache/save@v4
        with:
          path: nba-cache
          key: nba-db-${{ github.run_id }}
      - name: Continue the chain
        if: always()
        run: |
          AGAIN="${{ steps.wait.outputs.again }}"
          if [ "${{ steps.wait.outputs.go }}" = "1" ]; then AGAIN=$(python p/nba_wait.py more | sed -n 's/^again=//p'); fi
          echo "again=$AGAIN"
          if [ "$AGAIN" = "1" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/nba.yml/dispatches" -f ref=main
          fi
