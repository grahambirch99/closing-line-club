name: universe

# Passive universe logger for new markets (research/universe_PREREG.md in the private repo): NHL, NCAAB and NCAAF
# game lines at Pinnacle, Novig, ProphetX and Kalshi. No picks, nothing posted, nothing committed.
# Each run sleeps (free in a public repo) until the next planned pull (entry 3 h before each sport's first start, a
# close 12 min before each cluster of starts), pulls (3 credits per sport), and chains a fresh run before its time
# limit. The crons only (re)start the chain. Raw odds stay in a GitHub Actions cache. Monthly cap 2,000 credits.
# College football PAPER picks (no Big Ten/SEC teams, research/cfb_v1_PREREG.md) come from the same pulls: an extra pick
# pull 75 min before each start cluster. Picks go to data/cfb/paper.csv (committed within 5 min, so each is timestamped
# before kickoff) and the site rebuilds; graded from scores. Only that derived file is committed, never raw odds.
on:
  schedule:
    - cron: "10 13 * * *"   # ~6 AM PT
    - cron: "40 20 * * *"   # ~1:40 PM PT
  workflow_dispatch:
    inputs:
      task:
        description: "run = logger chain; report = write the report to the run summary"
        type: choice
        options: [run, report]
        default: run
      budget:
        description: "Minutes this run may wait for pulls before chaining a fresh run"
        default: "320"

concurrency:
  group: universe
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  log:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      UNIVERSE_DB: universe-cache/universe.db
      MIN_CREDITS_RESERVE: "2500"
      UNIVERSE_MONTHLY_CAP: "2000"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: grahambirch99/nfl-odds-logger
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: p
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore universe cache
        uses: actions/cache/restore@v4
        with:
          path: universe-cache
          key: uni-db-${{ github.run_id }}
          restore-keys: uni-db-
      - name: Scores (at most once per 20 h) + grade college football paper picks
        run: |
          python p/universe.py scores || true
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          git add data/cfb 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "cfb paper graded $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main || true
          fi
      - name: Report
        if: inputs.task == 'report'
        run: python p/universe.py report
      - name: Log
        id: log
        if: inputs.task != 'report'
        run: |
          # commit new college football paper picks within 5 minutes, then rebuild the site (picks show after its 20-min delay)
          ( while sleep 300; do
              git add data/cfb 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -qm "cfb paper picks $(date -u +%Y-%m-%dT%H:%MZ)"
                for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
                gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main > /dev/null 2>&1 || true
              fi
            done ) &
          python p/universe.py run --budget "${{ inputs.budget || '320' }}" | tee run.log
          echo "again=$(sed -n 's/^again=//p' run.log | tail -1)" >> "$GITHUB_OUTPUT"
          python p/universe.py scores || true      # CLV for games that kicked off during this run
          git add data/cfb 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "cfb paper $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main || true
          fi
      - name: Save universe cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: universe-cache
          key: uni-db-${{ github.run_id }}
      - name: Continue the chain
        if: always() && steps.log.outputs.again == '1'
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/universe.yml/dispatches" -f ref=main
