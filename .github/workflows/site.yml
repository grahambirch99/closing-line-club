name: site

# Builds the Closing Line Club site from the PRIVATE pipeline repo (grahambirch99/nfl-odds-logger, read with the
# PRIVATE_REPO_TOKEN secret) and deploys it to GitHub Pages. Started by the news watcher (every ~30 min, 5 AM-9 PM PT)
# and the NBA job; when a pick is still inside its 20-minute delay, the run waits for it and starts the next build. Only the built site (picks after a 20-minute delay,
# results, CLV) is committed here; raw odds, bankroll and pending picks stay private.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: grahambirch99/nfl-odds-logger
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: p
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        env:
          SITE_DIR: site
          PICKS_LEDGER: p/data/picks/ledger.csv
          NEWS_FEED: data/news/feed.jsonl
          PUBLISH_DELAY_MIN: "20"
          NEXT_RELEASE_FILE: next_release.txt
        run: |
          mkdir -p site
          cp p/site/*.html p/site/*.css p/site/*.js p/site/*.svg site/
          python p/site_build.py
      - name: Commit (timestamps the picks publicly)
        run: |
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          git add site
          if ! git diff --cached --quiet; then
            git commit -qm "site update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
          fi
      - name: Pick'em page (unlisted; deployed but never committed)
        run: ODDS_DB=p/data/odds.db PICKEM_SHEET=p/data/pickem/sheet.csv python p/pickem.py --site site || echo "pick'em page skipped"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Discord alerts for new picks and results
        env:
          SITE_DIR: site
          EMAIL_STATE: data/site/emailed.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_NBA: ${{ secrets.DISCORD_WEBHOOK_NBA }}
          PROPS_PAPER: p/data/props_paper/paper.csv
          ANGLES_PAPER: p/data/picks/angles_paper.csv
        run: |
          DISCORD_STATE=data/site/discord.json python p/discord_alerts.py
          git add data/site
          if ! git diff --cached --quiet; then
            git commit -qm "email state $(date -u +%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
          fi
      - name: Rebuild when held picks are due
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(cat next_release.txt 2>/dev/null || true)
          [ -z "$NEXT" ] && { echo "no picks waiting"; exit 0; }
          WAIT=$(( $(date -d "$NEXT" +%s) - $(date +%s) + 30 ))
          echo "next pick releases $NEXT (in ${WAIT}s)"
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -lt 1800 ]; then sleep "$WAIT"; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main
