name: news-watch

# Free NFL news watcher: Sleeper injury statuses, RotoWire RSS, Bluesky reporters. Watches continuously from ~5 AM to
# ~9 PM PT, polling every 3 min: each ~27-minute run starts the next one (GitHub's cron runs hours late, so the crons
# below only restart the chain) and triggers a site rebuild, which also posts new picks/results to Discord. QB / injury news dispatches a fresh odds pull in the private pipeline repo (via PRIVATE_REPO_TOKEN).
on:
  schedule:
    - cron: "*/30 12-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to watch"
        default: "27"
      test_dispatch:
        description: "yes = check the token can start a (free) close check in the private repo"
        default: "no"

concurrency:
  group: news-watch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: grahambirch99/nfl-odds-logger
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: p
          fetch-depth: 1
      - name: Unpack private odds.db (stored as p/data/odds.db.gz since Nov 9)
        run: if [ -f p/ops/db.sh ]; then bash p/ops/db.sh unpack; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test dispatch into the private repo
        if: ${{ inputs.test_dispatch == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: gh api -X POST repos/grahambirch99/nfl-odds-logger/actions/workflows/odds.yml/dispatches -f ref=main -f "inputs[mode]=close"
      - name: Watch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PIPELINE_REPO: grahambirch99/nfl-odds-logger
          NEWS_DIR: data/news
          NEWS_SOURCES: p/data/news/sources.json
          ODDS_DB: p/data/odds.db
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISPATCH: "1"
          MINUTES: ${{ inputs.minutes || '27' }}
        run: python p/news_watch.py --minutes "$MINUTES" --tick 180
      - name: Save
        if: always()
        run: |
          git config user.name  "closing-line-club"
          git config user.email "closing-line-club@users.noreply.github.com"
          git add data/news
          if ! git diff --cached --quiet; then
            git commit -qm "news $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
          fi
      - name: Continue the chain and rebuild the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/site.yml/dispatches" -f ref=main || true
          H=$(TZ=America/Los_Angeles date +%-H)
          if [ "$H" -ge 5 ] && [ "$H" -lt 21 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/news.yml/dispatches" -f ref=main
          else
            echo "outside 5 AM-9 PM PT: chain stops until the morning cron"
          fi
