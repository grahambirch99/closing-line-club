name: lean-monitor

# Weekly Over/Under lean monitor on Kalshi NFL player-prop main lines (free public data, free public-repo minutes).
# Runs the code from the private pipeline repo (checked out at p/) and hands only the aggregate report back there
# (lean_save.yml in the private repo commits it to data/lean/). Per-market Kalshi prices stay in this workflow's cache; nothing is committed to this public repo.
on:
  schedule:
    - cron: "17 14 * * 2"   # Tue ~7:17 AM PT (after Monday night's game settles)
    - cron: "17 14 * * 3"   # Wed backup (cheap: only adds games not already cached)
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Optional cap on markets priced this run (blank = all new)"
        default: ""

concurrency:
  group: lean-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          repository: grahambirch99/nfl-odds-logger
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: p
          fetch-depth: 1
      - name: Unpack private odds.db (stored as p/data/odds.db.gz since Nov 9)
        run: if [ -f p/ops/db.sh ]; then bash p/ops/db.sh unpack; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q pandas pyarrow
      - name: Restore market cache
        uses: actions/cache/restore@v4
        with:
          path: lean-cache
          key: lean-v2-${{ github.run_id }}
          restore-keys: lean-v2-
      - name: Live-ladder smoke test (throwaway db)
        continue-on-error: true
        run: ODDS_DB=/tmp/kalshi_smoke.db timeout 300 python p/lean_monitor.py smoke 2>&1 | tee -a /tmp/lean.log
      - name: Add newly settled games
        id: upd
        run: |
          MAX="${{ inputs.max_markets || '9000' }}"
          set -o pipefail
          python p/lean_monitor.py update --cache lean-cache/markets.csv.gz ${MAX:+--max $MAX} 2>&1 | tee -a /tmp/lean.log
      - name: Save market cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lean-cache
          key: lean-v2-${{ github.run_id }}
      - name: Report
        run: |
          set -o pipefail
          LEAN_OUT=p/data/lean python p/lean_monitor.py report --cache lean-cache/markets.csv.gz 2>&1 | tee -a /tmp/lean.log
      - name: Hand the report to the private repo (lean_save.yml commits it there)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -o pipefail
          P=$(tar czf - -C p data/lean | base64 -w0)
          echo "payload ${#P} chars" | tee -a /tmp/lean.log
          gh api -X POST repos/grahambirch99/nfl-odds-logger/actions/workflows/lean_save.yml/dispatches \
            -f ref=main -f "inputs[payload]=$P" 2>&1 | tee -a /tmp/lean.log
      - name: Log summary (readable as a run annotation)
        if: always()
        run: |
          [ -f /tmp/lean.log ] || exit 0
          msg=$(tail -n 25 /tmp/lean.log | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=lean-monitor log::$msg"
      - name: Continue the backfill if markets are left
        if: steps.upd.outputs.remaining != '' && steps.upd.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/lean.yml/dispatches" -f ref=main
